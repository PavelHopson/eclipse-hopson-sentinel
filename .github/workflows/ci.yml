name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bun-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test (TypeScript)
        run: bun test

      - name: Typecheck supported Eclipse contracts
        run: bun run typecheck:supported

      - name: Audit inherited TypeScript debt
        run: bun run typecheck:debt

  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install httpx pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest test_smart_router.py test_atomic_chat_provider.py test_ollama_provider.py -v

  windows-doctor:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Windows Doctor contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sentinel-windows-doctor.ps1 -SelfTest
