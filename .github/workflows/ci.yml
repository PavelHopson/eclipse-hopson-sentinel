name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bun-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test (TypeScript)
        run: bun test

      - name: Setup Node for desktop contracts
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Test desktop contracts (Node)
        run: >-
          node --test
          scripts/dashboard-branding.contract.mjs
          scripts/dashboard-ultron-security.contract.mjs
          scripts/dashboard-usage-guide.contract.mjs
          scripts/dashboard-live-voice.test.mjs
          scripts/dashboard-live-voice-regression.test.mjs
          scripts/dashboard-voice-session.test.mjs
          scripts/dashboard-ollama-host.test.mjs
          scripts/dashboard-primary-voice-runtime.test.mjs
          scripts/dashboard-voice-turn.test.mjs
          scripts/voice-dictation-eval.test.mjs
          scripts/voice-local-smoke.test.mjs
          scripts/voice-recorded-eval.test.mjs
          scripts/decision-baseline-workflow.contract.mjs

      - name: Typecheck supported Eclipse contracts
        run: bun run typecheck:supported

      - name: Audit inherited TypeScript debt
        run: bun run typecheck:debt

  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install httpx pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest test_smart_router.py test_atomic_chat_provider.py test_ollama_provider.py -v

  dashboard-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci --ignore-scripts

      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build

      - name: Audit production dependencies
        working-directory: dashboard
        run: npm audit --omit=dev --audit-level=high

  windows-doctor:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Windows Doctor contract
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sentinel-windows-doctor.ps1 -SelfTest

      - name: Build GUI-only Ollama host (no model downloads)
        run: node dashboard/scripts/build-ollama-console-host.mjs

      - name: Verify Windows native lifecycle and voice readiness
        run: >-
          node --test
          scripts/ollama-lifecycle-native.test.mjs
          scripts/dashboard-ollama-host.test.mjs
          scripts/dashboard-primary-voice-runtime.test.mjs
          scripts/dashboard-owned-process.test.mjs
