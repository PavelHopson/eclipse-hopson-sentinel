name: Decision Baseline Evidence

on:
  workflow_dispatch:
    inputs:
      model:
        description: GitHub Models model ID or Sentinel alias
        required: true
        default: github:copilot
        type: string

permissions:
  contents: read
  models: read

jobs:
  baseline:
    name: GitHub Models baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLAUDE_CODE_USE_GITHUB: '1'
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_MODEL: ${{ inputs.model }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run decision baseline
        run: bun run decision:shadow:baseline -- --model "$OPENAI_MODEL"

      - name: Resolve and validate evidence
        shell: bash
        run: |
          set -euo pipefail
          report="$(find reports/decision-shadow -maxdepth 1 -type f -name 'baseline-*.json' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          if [ -z "$report" ] || [ ! -f "$report" ]; then
            echo "No baseline evidence file produced" >&2
            exit 1
          fi

          bun run decision:shadow:validate -- --report "$report" --require-live-engine
          echo "REPORT_PATH=$report" >> "$GITHUB_ENV"

      - name: Upload baseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: decision-baseline-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: error
          retention-days: 30
